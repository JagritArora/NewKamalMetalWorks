<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome | New Kamal Metal Works</title>
<meta name="description" content="Client home for New Kamal Metal Works." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css?v=40" />
</head>
<body class="login-page">

<nav class="site-nav">
  <a href="index.html#hero" class="brand">New Kamal <span>Metal Works</span></a>
  <button type="button" class="login-back" id="welcome-logout">Log out</button>
</nav>

<main class="login-shell">
  <div class="welcome-card" id="welcome-card" hidden>
    <span class="login-kicker welcome-fade" id="welcome-kicker" style="--d:0s">Client access</span>
    <h1 class="welcome-heading welcome-fade" id="welcome-heading" style="--d:.08s">Welcome.</h1>
    <p class="welcome-sub welcome-fade" style="--d:.16s">How can we help you today?</p>

    <div class="welcome-actions welcome-fade" style="--d:.26s">
      <a href="index.html#contact" class="btn btn-primary welcome-action">Request a quote</a>
      <a href="profile.html?edit" class="welcome-action-link">Edit your profile</a>
    </div>
  </div>

  <div class="login-card login-enter login-loading-card" id="welcome-loading">
    <div class="login-spinner" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="login-sub">Loading&hellip;</p>
  </div>
</main>

<footer class="login-footer">
  <p>&copy; <span id="year"></span> New Kamal Metal Works, Faridabad. All rights reserved.</p>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

var firebaseConfig = {
  apiKey: "AIzaSyDkEyDAOah5XzAOVjUux9SLhH60To2oTKs",
  authDomain: "new-kamal-metal-works.firebaseapp.com",
  projectId: "new-kamal-metal-works",
  storageBucket: "new-kamal-metal-works.firebasestorage.app",
  messagingSenderId: "595817400572",
  appId: "1:595817400572:web:8617eb7419e5049524af79"
};

var app = initializeApp(firebaseConfig);
var auth = getAuth(app);

var welcomeCard = document.getElementById("welcome-card");
var loadingCard = document.getElementById("welcome-loading");
var heading = document.getElementById("welcome-heading");
var kicker = document.getElementById("welcome-kicker");
var logoutBtn = document.getElementById("welcome-logout");

logoutBtn.addEventListener("click", function () { signOut(auth); });

function firstName(fullName) {
  if (!fullName) return "";
  return fullName.trim().split(/\s+/)[0];
}

function reveal(name, role) {
  heading.textContent = name ? "Welcome, " + name + "." : "Welcome.";
  kicker.textContent = role === "master" ? "Master access" : "Client access";
  loadingCard.hidden = true;
  welcomeCard.hidden = false;
}

onAuthStateChanged(auth, function (user) {
  if (!user) {
    window.location.replace("login.html");
    return;
  }
  if (!user.emailVerified) {
    // The sign-in/sign-up flows on login.html already block unverified
    // accounts from getting here -- bounce out cleanly if one slips
    // through (e.g. a bookmarked direct link).
    signOut(auth).then(function () {
      window.location.replace("login.html?unverified=1");
    });
    return;
  }

  // profile.html already looked this up moments ago on the way here and
  // left it in sessionStorage -- reading it back is instant, so the normal
  // path never needs its own Firestore connection at all. Firestore (and
  // its IndexedDB-backed local cache) is only pulled in as a fallback, for
  // a direct reload/bookmark of this page where that handoff didn't happen.
  var cachedName = null;
  var cachedRole = null;
  try {
    cachedName = sessionStorage.getItem("nkmw-fullname");
    cachedRole = sessionStorage.getItem("nkmw-role");
  } catch (e) {}

  if (cachedName !== null) {
    reveal(firstName(cachedName), cachedRole || "client");
    return;
  }

  var timedOut = false;
  var timeoutId = setTimeout(function () { timedOut = true; reveal("", "client"); }, 8000);

  import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js").then(function (mod) {
    var db = mod.initializeFirestore(app, { experimentalForceLongPolling: true });
    return mod.getDoc(mod.doc(db, "profiles", user.uid));
  }).then(function (snap) {
    clearTimeout(timeoutId);
    if (timedOut) return;
    if (snap.exists()) {
      var data = snap.data();
      reveal(firstName(data.fullName), data.role || "client");
    } else {
      reveal("", "client");
    }
  }).catch(function () {
    clearTimeout(timeoutId);
    if (timedOut) return;
    reveal("", "client");
  });
});

document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
