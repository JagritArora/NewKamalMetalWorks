<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-26887839-b2d2-4aec-8696-7367d491d14b/styles.css">
  <style>
    html, body { margin: 0; padding: 0; background: #f3f2f2; }
    a { color: #ec3013; text-decoration: none; }
    a:hover { color: #c42409; }
  </style>
  <script>window.OM_SCENES = '[{"name":"Feed","dur":2.5,"desc":"A finished flat rectangular sheet rides in on the roller conveyor toward the notching press"},{"name":"Align","dur":1,"desc":"The conveyor stops and datum marks position the sheet edge under the notching blade"},{"name":"Notch","dur":1.5,"desc":"The blade descends and cuts one open notch out of the near edge of the sheet"},{"name":"Drop","dur":0.8,"desc":"The removed edge slug separates and falls through the die opening into the scrap tray"},{"name":"Retract","dur":1.2,"desc":"The blade retracts and the clean new edge notch is revealed"},{"name":"Exit","dur":2,"desc":"The notched sheet conveys out of the press"},{"name":"Reset","dur":1,"desc":"The line clears and the next flat sheet feeds in - the loop closes without a cut"}]';</script>
  <script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
  <script>window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "dark": true,
    "labels": true,
    "accent": "#ec3013",
    "notchWidth": 150,
    "notchDepth": 105,
    "motionEditor": false
  }/*EDITMODE-END*/;</script>
</helmet>
<x-import component-from-global-scope="NotchingPress" from="./animations-v3.jsx ./tweaks-panel.jsx ./notching-scene.jsx" hint-size="100%,100%"></x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}"></script>
